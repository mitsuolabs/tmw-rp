name: TMW-PR_Musikly - Commit Hash Audit

on:
  push:
    branches: [indie-branch]
  pull_request:
    branches: [indie-branch]
  workflow_dispatch:

jobs:
  hash-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute cryptographic hash of HEAD commit
        run: node scripts/commit-hash.js

      - name: Upload hash artifact
        uses: actions/upload-artifact@v4
        with:
          name: commit-hash
          path: .artifacts/commit-hash.txt
