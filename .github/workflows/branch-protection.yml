name: TMW-PR_Musikly - Branch protection

on:
  pull_request:
    branches: [indie-branch]
  push:
    branches: [indie-branch]
  workflow_dispatch:

jobs:
  enforce-indie-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enforce protected branch rules
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/check-branch-policy.js
