<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The MitsuoLabs Web Radio Player (TMW-RP)</title>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    media-src 'self' https: data: blob:;
    connect-src 'self' https: wss: ws: data: blob:;
    object-src 'none';
    base-uri 'none';
    form-action 'none';
  ">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Permissions-Policy" content="
    accelerometer=(),
    ambient-light-sensor=(),
    battery=(),
    camera=(),
    display-capture=(),
    document-domain=(),
    encrypted-media=(),
    fullscreen=(self),
    gyroscope=(),
    geolocation=(),
    microphone=(),
    midi=(),
    payment=(),
    picture-in-picture=(),
    screen-wake-lock=()
  ">
  <meta name="referrer" content="no-referrer">
  <meta name="X-Content-Type-Options" content="nosniff">
  <meta name="X-Frame-Options" content="DENY">
  <style>
    :root {
      --bg: #000;
      --panel: rgba(255,255,255,0.035);
      --panel-strong: rgba(255,255,255,0.06);
      --text: #fff8dc;
      --muted: #cfcfd9;
      --accent: #fffe87;
      --border: rgba(255,255,255,0.12);
      --shadow: rgba(0,0,0,0.35);
      --transition: 180ms ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: grid;
      grid-template-columns: 420px minmax(0, 1fr);
      transition: opacity var(--transition);
      font-weight: 300;
    }

    button, select, input {
      font: inherit;
    }

    .console {
      background: linear-gradient(180deg, rgba(0,0,0,1), rgba(18,18,18,0.8));
      border-right: 1px solid var(--border);
      padding: 28px 22px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,254,135,0.35) transparent;
    }

    .console::-webkit-scrollbar {
      width: 8px;
    }

    .console::-webkit-scrollbar-thumb {
      background: rgba(255,254,135,0.25);
      border-radius: 999px;
    }

    .brand-header {
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .brand-header h1 {
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent);
      font-weight: 400;
    }

    .brand-header p {
      margin-top: 8px;
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .control-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.68rem;
    }

    select, input[type="text"], input[type="file"] {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 6px;
      transition: border-color var(--transition), background var(--transition);
    }

    select:focus, input[type="text"]:focus {
      border-color: rgba(255,254,135,0.7);
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition), transform var(--transition);
    }

    button:hover {
      border-color: rgba(255,254,135,0.48);
      background: rgba(255,254,135,0.05);
    }

    .btn-play {
      background: var(--text);
      color: #000;
      border-color: var(--text);
      font-weight: 600;
    }

    .btn-play:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .row button {
      flex: 1;
    }

    .eq-matrix {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 8px;
      min-height: 140px;
      padding: 12px 10px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
    }

    .eq-band {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: end;
      gap: 10px;
      height: 100%;
    }

    .eq-band input[type="range"] {
      appearance: slider-vertical;
      -webkit-appearance: slider-vertical;
      width: 8px;
      height: 84px;
      background: transparent;
      accent-color: var(--accent);
    }

    .eq-band span {
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin: 16px 0;
    }

    .meta-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      min-height: 88px;
    }

    .meta-card .meta-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .meta-card strong {
      display: block;
      color: var(--text);
      font-size: 0.88rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .stage {
      position: relative;
      background: radial-gradient(circle at top right, rgba(255,254,135,0.06), transparent 32%),
                  linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.08));
      overflow-y: auto;
      min-width: 0;
      padding: clamp(18px, 2vw, 34px);
    }

    .now-playing {
      margin-bottom: 18px;
    }

    .now-playing h2 {
      font-size: clamp(1.8rem, 2vw + 1rem, 2.8rem);
      line-height: 1.1;
      color: var(--accent);
      font-weight: 300;
      text-transform: none;
      word-break: break-word;
    }

    .now-playing p {
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, monospace;
      margin-top: 8px;
    }

    .live-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 18px;
    }

    .live-pill {
      display: inline-flex;
      border-radius: 999px;
      border: 1px solid rgba(255,254,135,0.35);
      background: rgba(255,254,135,0.06);
      color: var(--accent);
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px 10px;
    }

    .stream-title {
      display: inline-block;
      max-width: min(680px, 70vw);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
      font-size: 0.84rem;
      letter-spacing: 0.05em;
    }

    .visualizer-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      margin-top: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      max-height: 450px;
      display: block;
      background: rgba(0,0,0,0.18);
    }

    .feature-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .feature-chip {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.6rem;
      cursor: pointer;
    }

    .feature-chip.active {
      color: var(--accent);
      border-color: rgba(255,254,135,0.6);
      background: rgba(255,254,135,0.06);
    }

    .insight-panel {
      margin-top: 18px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px;
    }

    .insight-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .insight-stat {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px;
    }

    .insight-stat strong {
      display: block;
      color: var(--text);
      font-size: 1.05rem;
      margin-bottom: 4px;
    }

    .insight-stat span {
      color: var(--muted);
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(10,10,14,0.9);
      border: 1px solid rgba(255,254,135,0.32);
      color: var(--text);
      letter-spacing: 0.14em;
      font-size: 0.68rem;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
      z-index: 50;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hidden { display: none !important; }

    @media (max-width: 900px) {
      body {
        grid-template-columns: 1fr;
      }

      .console {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .feature-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="console">
    <div class="brand-header">
      <h1>MitsuoLabs</h1>
      <p>Web Radio Player</p>
    </div>

    <div class="control-group">
      <label>Signal Discovery Node</label>
      <select id="registry-base">
        <option value="radiobrowser">Radio Browser API (Decentralized)</option>
        <option value="custom-url">Direct Stream URL</option>
      </select>
    </div>

    <div class="control-group">
      <label>Vector Search Parameter</label>
      <input id="search-query" type="text" placeholder="Search by genre, city, or station name">
      <button id="btn-query" style="margin-top: 12px;">Execute Scan</button>
      <input id="custom-url-input" type="text" class="hidden" style="margin-top: 12px;" placeholder="Paste a direct stream URL">
    </div>

    <div class="control-group">
      <label>Secure Audio Target</label>
      <select id="target-station">
        <option value="">Select a station</option>
      </select>
    </div>

    <div class="row">
      <button id="btn-play" class="btn-play">Engage Link</button>
      <button id="btn-stop">Sever Link</button>
    </div>

    <div class="row">
      <button id="btn-favorite">Add Favorite</button>
      <button id="btn-queue">Queue Station</button>
    </div>

    <div class="control-group" style="margin-top: 20px;">
      <label>Master DSP Equalizer Matrix</label>
      <div class="eq-matrix">
        <div class="eq-band"><input type="range" min="-12" max="12" step="0.1" value="0" data-index="0"><span>60Hz</span></div>
        <div class="eq-band"><input type="range" min="-12" max="12" step="0.1" value="0" data-index="1"><span>230Hz</span></div>
        <div class="eq-band"><input type="range" min="-12" max="12" step="0.1" value="0" data-index="2"><span>910Hz</span></div>
        <div class="eq-band"><input type="range" min="-12" max="12" step="0.1" value="0" data-index="3"><span>910Hz</span></div>
        <div class="eq-band"><input type="range" min="-12" max="12" step="0.1" value="0" data-index="4"><span>16k</span></div>
      </div>
    </div>

    <div class="meta-grid">
      <div class="meta-card">
        <span class="meta-label">Station</span>
        <strong id="meta-station-name">No signal selected</strong>
      </div>
      <div class="meta-card">
        <span class="meta-label">Bitrate</span>
        <strong id="meta-bitrate">—</strong>
      </div>
      <div class="meta-card">
        <span class="meta-label">Codec</span>
        <strong id="meta-codec">—</strong>
      </div>
      <div class="meta-card">
        <span class="meta-label">Country</span>
        <strong id="meta-country">—</strong>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="now-playing">
      <div class="live-pill-row">
        <span class="live-pill">Live</span>
        <span class="live-pill">Local-first</span>
      </div>
      <h2 id="now-playing-title">Ready to tune in</h2>
      <p id="stream-status">Awaiting broadcast</p>
      <span class="stream-title" id="stream-title">No current stream title</span>
    </div>

    <div class="visualizer-wrapper">
      <canvas id="visualizer" width="900" height="360"></canvas>
    </div>

    <div class="feature-strip">
      <button class="feature-chip active" data-mode="classic">Classic</button>
      <button class="feature-chip" data-mode="warm">Warm</button>
      <button class="feature-chip" data-mode="night">Night</button>
    </div>

    <div class="insight-panel">
      <div class="insight-grid">
        <div class="insight-stat">
          <strong id="stat-streams">0</strong>
          <span>Stations</span>
        </div>
        <div class="insight-stat">
          <strong id="stat-status">Idle</strong>
          <span>Status</span>
        </div>
        <div class="insight-stat">
          <strong id="stat-volume">100%</strong>
          <span>Volume</span>
        </div>
        <div class="insight-stat">
          <strong id="stat-mode">Classic</strong>
          <span>Mode</span>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script>
    const state = {
      stations: [],
      favorites: JSON.parse(localStorage.getItem('tmw-rp-favorites') || '[]'),
      currentStation: null,
      currentSource: '',
      audio: null,
      audioContext: null,
      analyzer: null,
      masterGain: null,
      volume: 1,
      activeMode: 'classic',
      eqValues: Array(5).fill(0),
      rafId: null
    };

    const els = {
      registryBase: document.getElementById('registry-base'),
      searchQuery: document.getElementById('search-query'),
      customUrlInput: document.getElementById('custom-url-input'),
      btnQuery: document.getElementById('btn-query'),
      targetStation: document.getElementById('target-station'),
      btnPlay: document.getElementById('btn-play'),
      btnStop: document.getElementById('btn-stop'),
      btnFavorite: document.getElementById('btn-favorite'),
      btnQueue: document.getElementById('btn-queue'),
      nowPlayingTitle: document.getElementById('now-playing-title'),
      streamStatus: document.getElementById('stream-status'),
      streamTitle: document.getElementById('stream-title'),
      statStreams: document.getElementById('stat-streams'),
      statStatus: document.getElementById('stat-status'),
      statVolume: document.getElementById('stat-volume'),
      statMode: document.getElementById('stat-mode'),
      visualizer: document.getElementById('visualizer'),
      toast: document.getElementById('toast'),
      featureChips: document.querySelectorAll('.feature-chip'),
      eqSliders: document.querySelectorAll('input[type="range"]')
    };

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('visible');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        els.toast.classList.remove('visible');
      }, 1800);
    }

    function safeText(value, fallback = '—') {
      return value && String(value).trim() ? String(value).trim() : fallback;
    }

    function setMode(mode) {
      state.activeMode = mode;
      els.featureChips.forEach((chip) => {
        chip.classList.toggle('active', chip.dataset.mode === mode);
      });
      const palette = {
        classic: { bg: '#fffe87', glow: 'rgba(255,254,135,0.2)' },
        warm: { bg: '#ffbf69', glow: 'rgba(255,191,105,0.2)' },
        night: { bg: '#89a3ff', glow: 'rgba(137,163,255,0.2)' }
      };

      const active = palette[mode] || palette.classic;
      const canvas = els.visualizer.getContext('2d');
      canvas.strokeStyle = active.bg;
      canvas.shadowColor = active.bg;
      canvas.shadowBlur = 18;
      els.statMode.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
    }

    function updateVolumeUI() {
      els.statVolume.textContent = Math.round(state.volume * 100) + '%';
    }

    function ensureAudioGraph() {
      if (!state.audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;

        state.audioContext = new AudioCtx();
        state.analyzer = state.audioContext.createAnalyser();
        state.analyzer.fftSize = 512;
        state.masterGain = state.audioContext.createGain();
        state.masterGain.gain.value = state.volume;

        state.analyzer.connect(state.audioContext.destination);
        state.masterGain.connect(state.analyzer);
      }
      return state.audioContext;
    }

    function applyEQ() {
      if (!state.masterGain) return;

      const gains = [0, 1, 2, 3, 4].map((index) => {
        const value = state.eqValues[index] || 0;
        return value === 0 ? 1 : Math.pow(10, value / 20);
      });

      const filters = state.masterGain._tmwFilters || [];
      if (!filters.length) {
        const context = state.audioContext;
        filters[0] = context.createBiquadFilter();
        filters[0].type = 'lowpass';
        filters[0].frequency.value = 80;
        filters[0].connect(context.createBiquadFilter());
        filters[1] = context.createBiquadFilter();
        filters[1].type = 'peaking';
        filters[1].frequency.value = 220;
        filters[1].connect(context.createBiquadFilter());
        filters[2] = context.createBiquadFilter();
        filters[2].type = 'peaking';
        filters[2].frequency.value = 900;
        filters[2].connect(context.createBiquadFilter());
        filters[3] = context.createBiquadFilter();
        filters[3].type = 'peaking';
        filters[3].frequency.value = 4000;
        filters[3].connect(context.createBiquadFilter());
        filters[4] = context.createBiquadFilter();
        filters[4].type = 'highpass';
        filters[4].frequency.value = 14000;
        filters[4].connect(state.masterGain);

        state.masterGain._tmwFilters = filters;
      }

      filters.forEach((filter, index) => {
        filter.gain.value = state.eqValues[index] || 0;
      });
    }

    function stopPlayback() {
      if (state.audio) {
        state.audio.pause();
        state.audio.src = '';
        state.audio.load();
        state.audio = null;
      }

      els.streamStatus.textContent = 'Playback halted';
      els.statStatus.textContent = 'Idle';
      state.currentSource = '';
      state.currentStation = null;
      showToast('Stream stopped');
    }

    function playStation(station) {
      if (!station) return;

      stopPlayback();

      const url = station.url || station.streamurl || station.url_resolved;
      if (!url) {
        showToast('No playable URL');
        return;
      }

      const audio = new Audio();
      audio.src = url;
      audio.preload = 'auto';
      audio.crossOrigin = 'anonymous';
      audio.volume = state.volume;
      audio.autoplay = true;
      state.audio = audio;

      const context = ensureAudioGraph();
      if (context) {
        audio.srcObject = null;
        if (state.masterGain && state.masterGain !== audio) {
          audio.connect = function () {};
        }
      }

      // Keep playback responsive by making the audio element the single source of truth.
      audio.addEventListener('error', () => {
        els.streamStatus.textContent = 'Stream unavailable';
        els.statStatus.textContent = 'Error';
        showToast('Playback failed');
      });

      audio.addEventListener('loadedmetadata', () => {
        const stationName = safeText(station.name, 'Unknown station');
        els.nowPlayingTitle.textContent = stationName;
        els.streamStatus.textContent = 'Connected';
        els.statStatus.textContent = 'Live';
        els.streamTitle.textContent = safeText(station.name, 'Station');
      });

      audio.addEventListener('play', () => {
        els.streamStatus.textContent = 'Playing';
        els.statStatus.textContent = 'Live';
      });

      audio.addEventListener('pause', () => {
        els.streamStatus.textContent = 'Playback paused';
        els.statStatus.textContent = 'Paused';
      });

      audio.addEventListener('ended', stopPlayback);

      try {
        audio.play();
      } catch (error) {
        showToast('Autoplay blocked');
      }

      updateVolumeUI();
      showToast('Stream connected');
    }

    function renderStations(stations) {
      state.stations = stations || [];
      els.targetStation.innerHTML = '<option value="">Select a station</option>';
      stations.forEach((station) => {
        const option = document.createElement('option');
        option.value = station.stationuuid || station.name;
        option.textContent = station.name || 'Unknown station';
        option.dataset.url = station.url || station.streamurl || station.url_resolved || '';
        els.targetStation.appendChild(option);
      });
      els.statStreams.textContent = String(stations.length);
    }

    async function fetchStations() {
      const query = els.searchQuery.value.trim();
      const registry = els.registryBase.value;

      if (registry === 'custom-url') {
        els.customUrlInput.classList.remove('hidden');
        els.targetStation.classList.add('hidden');
        return;
      }

      els.customUrlInput.classList.add('hidden');
      els.targetStation.classList.remove('hidden');

      if (!query) {
        showToast('Search by name, city, or genre');
        return;
      }

      try {
        const response = await fetch(`https://de1.api.radio-browser.info/json/stations/search?name=${encodeURIComponent(query)}&limit=12`);
        if (!response.ok) throw new Error('Network failed');

        const stations = await response.json();
        renderStations(stations || []);
        if (!stations.length) {
          showToast('No stations found');
        }
      } catch (error) {
        showToast('Search failed');
      }
    }

    function bindUI() {
      els.btnQuery.addEventListener('click', fetchStations);

      els.registryBase.addEventListener('change', () => {
        const isCustom = els.registryBase.value === 'custom-url';
        els.customUrlInput.classList.toggle('hidden', !isCustom);
        els.targetStation.classList.toggle('hidden', isCustom);
      });

      els.btnPlay.addEventListener('click', () => {
        const selected = els.targetStation.value;
        const custom = els.customUrlInput.value.trim();

        if (custom) {
          playStation({
            name: 'Custom Stream',
            url: custom
          });
          return;
        }

        const station = state.stations.find((entry) => {
          const id = entry.stationuuid || entry.name;
          return id === selected;
        });

        if (station) {
          playStation(station);
        } else {
          showToast('Select a station first');
        }
      });

      els.btnStop.addEventListener('click', stopPlayback);

      els.btnFavorite.addEventListener('click', () => {
        if (!state.currentStation) {
          showToast('Add a station first');
          return;
        }

        const stationName = safeText(state.currentStation.name, 'Favorite');
        if (!state.favorites.includes(stationName)) {
          state.favorites.push(stationName);
          localStorage.setItem('tmw-rp-favorites', JSON.stringify(state.favorites));
          showToast('Favorite saved');
        } else {
          showToast('Favorite already saved');
        }
      });

      els.btnQueue.addEventListener('click', () => {
        if (!state.currentStation) {
          showToast('Queue not available');
          return;
        }
        showToast('Queued');
      });

      els.eqSliders.forEach((slider) => {
        slider.addEventListener('input', () => {
          const index = Number(slider.dataset.index);
          state.eqValues[index] = Number(slider.value);
          applyEQ();
        });
      });

      els.featureChips.forEach((chip) => {
        chip.addEventListener('click', () => {
          setMode(chip.dataset.mode);
        });
      });
    }

    function drawVisualizer() {
      const canvas = els.visualizer;
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;

      ctx.clearRect(0, 0, width, height);

      const gradient = ctx.createLinearGradient(0, 0, width, 0);
      gradient.addColorStop(0, 'rgba(255,254,135,0)');
      gradient.addColorStop(0.5, 'rgba(255,254,135,0.8)');
      gradient.addColorStop(1, 'rgba(255,254,135,0)');

      ctx.beginPath();
      ctx.moveTo(0, height / 2);

      for (let x = 0; x <= width; x += 10) {
        const y = Math.sin((x / 18) + performance.now() / 360) * 18 + height / 2;
        ctx.lineTo(x, y);
      }

      ctx.strokeStyle = gradient;
      ctx.shadowColor = 'rgba(255,254,135,0.25)';
      ctx.shadowBlur = 18;
      ctx.lineTo(width, height / 2);
      ctx.stroke();

      const freq = state.analyzer;
      if (freq) {
        const data = new Uint8Array(freq.frequencyBinCount);
        freq.getByteFrequencyData(data);

        ctx.beginPath();
        for (let x = 0; x < data.length; x += 2) {
          const y = 40 + (data[x] * (height - 80) / 255);
          ctx.lineTo(x / 2, y);
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.stroke();
      }
    }

    function animate() {
      drawVisualizer();
      state.rafId = requestAnimationFrame(animate);
    }

    function init() {
      bindUI();
      setMode('classic');
      updateVolumeUI();
      animate();
      showToast('TMW-RP ready');
    }

    init();
  </script>
</body>
